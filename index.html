<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Multi-Type Captcha</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <div class="captcha-card">
            <h1>Security Verification</h1>
            <p class="subtitle">Please complete the captcha to continue.</p>

            <div class="stats-container">
                <div class="stat-box success">
                    <span class="label">Success</span>
                    <span id="successCount" class="value">0</span>
                </div>
                <div class="stat-box failure">
                    <span class="label">Failed</span>
                    <span id="failureCount" class="value">0</span>
                </div>
            </div>

            <div class="selector-group">
                <label for="captchaTypeSelector">Select Captcha Type:</label>
                <select id="captchaTypeSelector">
                    <option value="math">Math Challenge</option>
                    <option value="text">Text Recognition</option>
                    <option value="slider">Slider Puzzle</option>
                </select>
            </div>

            <div id="captchaDisplayArea" class="captcha-display">
                <!-- Dynamic Captcha Content -->
            </div>

            <div id="inputArea" class="input-area">
                <input type="text" id="captchaInput" placeholder="Enter answer" autocomplete="off">
            </div>

            <div class="action-buttons">
                <button id="refreshBtn" class="secondary-btn" title="Refresh Captcha">
                    <i class="fas fa-sync-alt"></i>
                </button>
                <button id="verifyBtn" class="primary-btn">Verify</button>
            </div>

            <div id="feedback" class="feedback-message"></div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
