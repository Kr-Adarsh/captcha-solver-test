<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Captcha Verification</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome for the refresh icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <div class="captcha-card">
            <h1>Security Check</h1>
            <p class="instruction">Please solve the math problem below to verify you are human.</p>
            
            <div class="captcha-display">
                <div id="captcha-text" class="captcha-code"></div>
                <button id="refresh-btn" class="icon-btn" title="Get new captcha">
                    <i class="fas fa-redo-alt"></i>
                </button>
            </div>

            <div class="input-group">
                <input type="number" id="user-input" placeholder="Enter your answer" autocomplete="off">
                <button id="verify-btn">Verify</button>
            </div>

            <div id="message" class="message"></div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
